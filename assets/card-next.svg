<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Your idea? — Bots, Mini Apps, internal tools, MVPs">
  <title>Your idea?</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a16"/><stop offset="1" stop-color="#171028"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="clip"><rect width="600" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .in { }
    @keyframes slide { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }

    .cp { transform-box: fill-box; transform-origin: center; animation: wave 2.6s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: scale(1); opacity: 1; } 30% { transform: scale(.7); opacity: .55; } }
</style>
  <g clip-path="url(#clip)">
    <rect width="600" height="300" fill="url(#bg)"/>
    <rect width="600" height="300" fill="url(#grid)"/>
    
    <g transform="translate(444 66)">
      <rect class="cp" x="44" y="0" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.00s"/><rect class="cp" x="0" y="22" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.12s"/><rect class="cp" x="22" y="22" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.24s"/><rect class="cp" x="44" y="22" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.36s"/><rect class="cp" x="66" y="22" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.48s"/><rect class="cp" x="88" y="22" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.60s"/><rect class="cp" x="44" y="44" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.72s"/><rect class="cp" x="22" y="66" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.84s"/><rect class="cp" x="66" y="66" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:0.96s"/><rect class="cp" x="0" y="88" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:1.08s"/><rect class="cp" x="88" y="88" width="20" height="20" rx="3" fill="#ac9cd9" style="animation-delay:1.20s"/>
    </g>
    <g transform="translate(444 196)" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace" font-size="15">
      <rect x="-12" y="0" width="134" height="34" rx="17" fill="#b9a6ff"/>
      <text x="55" y="22" text-anchor="middle" fill="#0d0a16" font-weight="700">let's talk →</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="599" height="299" rx="18" fill="none" stroke="#2c2347"/>
  <g class="in" style="animation-delay:.1s">
    <text x="32" y="44" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#b9a6ff">NEXT PROJECT</text>
    
    <text x="32" y="90" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" fill="#f4f1ff">Your idea?</text>
    <text x="32" y="116" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" fill="#a79fc6">Bots, Mini Apps, internal tools, MVPs</text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text x="32" y="150" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" fill="#c4bce4">I take products from a napkin sketch</text>
    <text x="32" y="176" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" fill="#c4bce4">to real users: scope, architecture,</text>
    <text x="32" y="202" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" fill="#c4bce4">build, launch, iterate.</text>
  </g>
  <g class="in" style="animation-delay:.5s">
    <rect x="32" y="244" width="49" height="28" rx="14" fill="#b9a6ff" fill-opacity="0.12" stroke="#b9a6ff" stroke-opacity="0.35"/><text x="56.5" y="263" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#b9a6ff">MVP</text><rect x="89" y="244" width="58" height="28" rx="14" fill="#b9a6ff" fill-opacity="0.12" stroke="#b9a6ff" stroke-opacity="0.35"/><text x="118.0" y="263" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#b9a6ff">SaaS</text><rect x="155" y="244" width="110" height="28" rx="14" fill="#b9a6ff" fill-opacity="0.12" stroke="#b9a6ff" stroke-opacity="0.35"/><text x="210.0" y="263" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#b9a6ff">Automation</text>
  </g>
</svg>
