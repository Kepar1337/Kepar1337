  <style>
    .px { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1) backwards; }
    @keyframes pop { 0% { opacity:0; transform: scale(.2) rotate(-20deg); } 100% { opacity:1; transform: scale(1) rotate(0); } }
    .float { animation: float 5s ease-in-out 1.4s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .pt { opacity: 0; animation-name: rise; animation-iteration-count: infinite; animation-timing-function: linear; }
    @keyframes rise { 0% { opacity:0; transform: translateY(0); } 15% { opacity:.55; } 100% { opacity:0; transform: translateY(-140px); } }
    .cg { animation: shimmer 4s ease-in-out infinite; }
    @keyframes shimmer { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .in { animation: slide .7s ease-out backwards; }
    @keyframes slide { from { opacity:0; transform: translateX(-14px); } to { opacity:1; transform: none; } }
    .sweep { animation: sweep 7s ease-in-out 2s infinite; }
    @keyframes sweep { 0% { transform: translateX(-700px); } 40%,100% { transform: translateX(1500px); } }
    .glow { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.75; transform: scale(1); } 50% { opacity:1; transform: scale(1.08); } }
  </style>
