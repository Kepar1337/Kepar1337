  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a16"/><stop offset="1" stop-color="#171028"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9a6ff" stop-opacity="0.45"/><stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4c8ff"/><stop offset="1" stop-color="#ac9cd9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e2d9ff"/><stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
